name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/DriveFlow.Core.Tests --configuration Release

  windows:
    # Compila a janela e abre o pacote publicado no modo de teste rápido.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes no Windows
        run: dotnet test tests/DriveFlow.Core.Tests -c Release --blame-hang-timeout 60s --logger "console;verbosity=normal"
      - run: dotnet publish src/DriveFlow.App -c Release -o publish/DriveFlow
      - name: Teste rápido do pacote
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'smoke.json'
          $p = Start-Process publish/DriveFlow/DriveFlow.exe -ArgumentList '--smoke-test', $out -PassThru
          $closed = $p.WaitForExit(60000)
          if (Test-Path $out) { Get-Content $out }
          if (-not $closed) { $p.Kill(); throw 'O DriveFlow não fechou no teste rápido.' }
          if (-not (Test-Path $out)) { throw 'O teste rápido não gravou o resultado.' }
          $result = Get-Content $out | ConvertFrom-Json
          $result | Format-List
          if (-not $result.ok) { throw 'Teste rápido falhou.' }
